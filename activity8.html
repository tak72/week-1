<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
<div class="col-12 text-center bg-dark text-light p-4" >
   <h1>Stunning Bootstrap Alignment Layout</h1>
   </div>
<div class="row justify-content-evenly mt-5">
    <div class="col-4  bg-primary border text-white text-center p-3">left box</div>
    <div class="col-4  bg-secondary border text-white text-center p-3">middle box</div>
    <div class="col-4 bg-warning border text-white text-center p-3">right box</div>
</div>
<div class="row bg-info mt-5 p-5 justify-content-center" >
            <div class="col-4 bg-light text-dark text-center p-4">center vertically</div>
</div>
<div class="row bg-secondary mt-5 p-5 justify-content-center">
     <div class="col-3 bg-dark text-light text-center p-3">Bottom Align</div>
      <div class="col-6 bg-success text-light text-center p-3">Also bottom Aligned</div>
       <div class="col-3 bg-dark text-light text-center p-3">Bottom Align</div>
</div>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>   
</body>
</html>
